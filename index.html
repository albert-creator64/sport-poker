<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Sport Poker — клуб</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">

  <div class="tab-view" id="view-fixture">
    <div class="hdr">
      <div class="crest">♠</div>
      <div class="hdr-info">
        <div class="hdr-name" id="clubName">Sport Poker</div>
        <div class="hdr-sub" id="clubSub">клуб спортивного покера</div>
      </div>
      <div class="hdr-actions"><a class="mini-link" href="admin.html" rel="noopener">Админ</a></div>
    </div>

    <div class="content">
      <div class="feat-tile" id="featTile">
        <div class="chart"></div>
        <div class="ft-kicker" id="featKick">БЛИЖАЙШИЙ ТУРНИР</div>
        <div class="ft-name" id="featName">—</div>
        <div class="ft-stats" id="featStats"></div>
      </div>

      <div class="sec-title">Афиша турниров</div>
      <div id="fixtureList"></div>

      <div class="sec-title">О клубе</div>
      <div class="t-tile">
        <div class="rule-item"><div class="rule-ic">📍</div><div><b>Где играем</b><div class="rule-sub" id="clubInfo"></div></div></div>
        <div class="rule-item" style="margin-top:14px"><div class="rule-ic">📞</div><div><b>Контакты</b><div class="rule-sub" id="clubContact"></div></div></div>
      </div>
    </div>
  </div>

  <div class="tab-view" id="view-rating" style="display:none">
    <div class="hdr">
      <div class="crest">🏆</div>
      <div class="hdr-info">
        <div class="hdr-name">Рейтинг</div>
        <div class="hdr-sub">турнирная таблица</div>
      </div>
    </div>
    <div class="content">
      <div class="sec-title">Очки за место<span class="hint">1-е = 100 · считается по формуле (участники − место + 1) / участники × 100</span></div>
      <div id="ratingTable"></div>
      <div class="sec-title">Турниры</div>
      <div id="tournamentList" class="tourn-wrap"></div>
    </div>
  </div>

  <div class="tab-view" id="view-profile" style="display:none">
    <div class="hdr">
      <div class="crest">🙍</div>
      <div class="hdr-info">
        <div class="hdr-name">Мой профиль</div>
        <div class="hdr-sub">вход по номеру телефона</div>
      </div>
    </div>
    <div class="content" id="profileBody"></div>
  </div>

  <nav class="tabbar" id="tabbar">
    <button class="on" data-tab="0" onclick="goTab(0)"><span class="ic">♠️</span>Афиша</button>
    <button data-tab="1" onclick="goTab(1)"><span class="ic">🏆</span>Рейтинг</button>
    <button data-tab="2" onclick="goTab(2)"><span class="ic">🙍</span>Профиль</button>
  </nav>

</div>
<script src="db.js"></script>
<script src="app.js"></script>
</body>
</html>
